<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Old Paper & Ink | Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Crimson+Text&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: 'Crimson Text', serif;
      background: linear-gradient(to right, #1f1f2f, #29293d);
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .sparkle {
      position: absolute;
      bottom: -10px;
      width: 6px;
      height: 6px;
      background: #ffffff88;
      box-shadow: 0 0 10px #fff;
      border-radius: 50%;
      animation: rise 6s linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(0.5);
        opacity: 0;
      }
    }

    .auth-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      width: 340px;
      padding: 30px 25px;
      transition: transform 0.3s ease;
      animation: slideUp 0.6s ease;
      position: relative;
      z-index: 10;
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
      color: #ccc;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #9f7aea;
      background-color: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #7e5bef;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #6842d9;
    }

    .toggle-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .toggle-link a {
      color: #a78bfa;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 400px) {
      .auth-wrapper {
        width: 90%;
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sparkles -->
  <div id="sparkleContainer"></div>

  <!-- Auth Box -->
  <div class="auth-wrapper" id="authBox">
    <div id="loginForm">
      <h2>Login</h2>
      <p>Welcome back to <strong>The Old Paper & Ink</strong></p>
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn">Log In</button>
      <div class="toggle-link">
        Don't have an account? <a onclick="toggleForm()">Sign Up</a>
      </div>
    </div>

    <div id="signupForm" class="hidden">
      <h2>Sign Up</h2>
      <p>Begin your magical journey 🌙</p>
      <div class="form-group">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" />
      </div>
      <button id="loginBtn" class="btn">Log In</button>
      <div class="toggle-link">
        Already a member? <a onclick="toggleForm()">Log In</a>
      </div>
    </div>
  </div>

  <script>
    // Form toggler
    function toggleForm() {
      const login = document.getElementById('loginForm');
      const signup = document.getElementById('signupForm');
      login.classList.toggle('hidden');
      signup.classList.toggle('hidden');
    }

    // Basic login simulation
    document.querySelector('.btn').addEventListener('click', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      if (email && pass) {
        window.location.href = "home.html";
      } else {
        alert("Please enter email and password.");
      }
    });

    // Sparkles generation
    const container = document.getElementById('sparkleContainer');
    for (let i = 0; i < 40; i++) {
      const sparkle = document.createElement('span');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.animationDelay = Math.random() * 6 + 's';
      sparkle.style.width = `${Math.random() * 4 + 3}px`;
      sparkle.style.height = sparkle.style.width;
      container.appendChild(sparkle);
    }
  </script>
</body>
</html>
